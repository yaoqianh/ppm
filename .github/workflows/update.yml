name: 每日更新持仓看板

on:
  # 每交易日北京时间 15:30 与 17:30 各跑一次（GitHub cron 用 UTC，UTC+8）
  # 跑两次是为了防止 GitHub 定时任务排队延迟导致错过收盘数据；同一天重复运行不会产生重复快照
  # 注意：GitHub 的定时任务可能被延迟（实测出现过延迟到 22:17 北京时间），所以别指望它分秒不差
  schedule:
    - cron: '30 7,9 * * 1-5'
  # 手动改了持仓 / 调仓 / 评分配置后，推送即自动重算并重新部署
  push:
    branches: [main, master]
    paths:
      - 'data/positions.json'
      - 'data/trades.json'
      - 'data/fundamentals.json'
      - 'config/**'
      # 前端或引擎代码变了也要立刻重新部署，否则要等到下一个定时班次才生效
      - 'index.html'
      - 'assets/**'
      - 'engine/**'
      - 'run_update.py'
      # 改工作流本身也应该触发一次，便于验证修复
      - '.github/workflows/**'
  # 也可以在 GitHub 网页上点「Run workflow」手动触发
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# 防止两次运行互相打断导致提交冲突
concurrency:
  group: update-dashboard
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 拉取行情并重新计算评分
        id: refresh
        run: python run_update.py --no-backfill
        continue-on-error: true

      - name: 取数失败则中止，保留上次数据
        if: steps.refresh.outcome == 'failure'
        run: |
          echo "::error::行情更新失败，已保留上一次的数据，本次不部署。"
          exit 1

      - name: 提交更新后的数据
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data/
          if git diff --staged --quiet; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "chore(data): 更新看板数据 $(date -u +'%Y-%m-%d %H:%M UTC') [skip ci]"
            git push
          fi

      # 只把前端真正需要的文件放进发布目录：
      # 产物更小（跳过 .git / engine / 源数据），也顺带避免把持仓源文件当静态资源暴露出去
      - name: 整理发布目录
        run: |
          rm -rf _site
          mkdir -p _site/data _site/assets
          cp index.html _site/
          cp assets/style.css assets/app.js _site/assets/
          cp data/dashboard.json _site/data/
          echo "发布内容："
          find _site -type f | sort

      - name: 打包站点
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
